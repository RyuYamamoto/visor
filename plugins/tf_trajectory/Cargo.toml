[package]
name = "visor-plugin-tf-trajectory"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Visor plugin: draws the trail a TF frame leaves behind in the fixed frame"
publish = false

[dependencies]
# Plugins depend only on visor's `plugin` facade; the shared dependency versions come from this same workspace.
visor = { path = "../.." }
egui = "0.35.0"
nalgebra = "0.35.0"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
